<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お店ランチャー</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e8590c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta property="og:title" content="お店ランチャー">
<meta property="og:image" content="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23e8590c'/%3E%3Ctext x='50' y='66' font-size='52' text-anchor='middle' fill='white'%3E店%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --text: #2b2b2b;
    --sub: #7a7468;
    --line: #e6e0d6;
    --accent: #e8590c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding-bottom: 90px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--line);
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  h1 { font-size: 18px; margin: 0; }
  .edit-toggle {
    border: 1px solid var(--line); background: var(--card); color: var(--sub);
    border-radius: 18px; padding: 6px 14px; font-size: 13px;
  }
  .edit-toggle.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .search {
    width: 100%; padding: 12px 14px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--card);
    outline: none;
  }
  .search:focus { border-color: var(--accent); }
  main { padding: 12px 14px; display: grid; gap: 10px; }
  .item {
    display: flex; align-items: stretch; gap: 0;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden;
  }
  .launch {
    flex: 1; display: flex; align-items: center; gap: 12px;
    padding: 12px; text-decoration: none; color: inherit; min-width: 0;
  }
  .launch:active { background: #f4efe7; }
  .badge {
    flex: none; width: 48px; height: 48px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: bold; font-size: 20px;
  }
  .info { min-width: 0; }
  .name { font-size: 17px; font-weight: bold; }
  .last { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .note { font-size: 13px; color: #5c564b; margin-top: 4px; white-space: pre-wrap; word-break: break-all; }
  .nourl { font-size: 12px; color: #c92a2a; margin-top: 2px; }
  .tools {
    display: none; flex-direction: column; border-left: 1px solid var(--line);
  }
  body.editing .tools { display: flex; }
  .tools button {
    flex: 1; border: none; background: #fbf9f5; padding: 0 12px; font-size: 15px; color: var(--sub);
    border-bottom: 1px solid var(--line);
  }
  .tools button:last-child { border-bottom: none; }
  .tools button:active { background: #efe9dd; }
  .tabs { display: flex; gap: 8px; margin-top: 8px; }
  .tab {
    flex: 1; padding: 8px; font-size: 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--sub);
  }
  .tab.on { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: bold; }
  .group { margin-bottom: 4px; }
  .group summary {
    font-size: 15px; font-weight: bold; padding: 8px 4px; cursor: pointer; list-style: none;
  }
  .group summary::-webkit-details-marker { display: none; }
  .group summary::before { content: '▾ '; color: var(--sub); }
  .group:not([open]) summary::before { content: '▸ '; }
  .group .cnt { font-size: 12px; color: var(--sub); font-weight: normal; margin-left: 4px; }
  .group-body { display: grid; gap: 10px; }
  body.grouped .tools .mv { display: none; }
  .empty { text-align: center; color: var(--sub); padding: 40px 10px; font-size: 14px; }
  .fab {
    position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom));
    width: 56px; height: 56px; border-radius: 28px; border: none;
    background: var(--accent); color: #fff; font-size: 30px; line-height: 1;
    box-shadow: 0 4px 12px rgba(0,0,0,.25);
  }
  .backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20;
    align-items: flex-end; justify-content: center;
  }
  .backdrop.show { display: flex; }
  .sheet {
    background: var(--card); width: 100%; max-width: 520px;
    border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    max-height: 90vh; overflow-y: auto;
  }
  .sheet h2 { margin: 0 0 12px; font-size: 16px; }
  .sheet label { display: block; font-size: 12px; color: var(--sub); margin: 10px 0 4px; }
  .sheet input[type=text], .sheet input[type=url], .sheet textarea {
    width: 100%; padding: 11px 12px; font-size: 16px; font-family: inherit;
    border: 1px solid var(--line); border-radius: 10px; background: #fff;
  }
  .sheet textarea { min-height: 70px; resize: vertical; }
  .sheet input[type=color] { width: 60px; height: 40px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: #fff; }
  .hint { font-size: 11px; color: var(--sub); margin-top: 4px; line-height: 1.5; }
  .btn-row { display: flex; gap: 10px; margin-top: 16px; }
  .btn-row button { flex: 1; padding: 13px; font-size: 15px; border-radius: 12px; border: 1px solid var(--line); background: #fff; }
  .btn-row .primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: bold; }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>お店ランチャー</h1>
    <button class="edit-toggle" id="editToggle">編集</button>
  </div>
  <input class="search" id="search" type="search" placeholder="店名・場所・メモで絞り込み" autocomplete="off">
  <div class="tabs">
    <button id="tabList" class="tab on">一覧</button>
    <button id="tabPlace" class="tab">場所別</button>
  </div>
</header>

<main id="list"></main>

<button class="fab" id="addBtn" aria-label="お店を追加">＋</button>

<div class="backdrop" id="backdrop">
  <div class="sheet">
    <h2 id="sheetTitle">お店を追加</h2>
    <label for="fName">店名</label>
    <input type="text" id="fName" autocomplete="off">
    <label for="fPlace">場所（モール名など。複数ならカンマ区切り）</label>
    <input type="text" id="fPlace" list="placeList" placeholder="例：○○モール、△△通り" autocomplete="off">
    <datalist id="placeList"></datalist>
    <label for="fUrl">URL（公式サイトなど）</label>
    <input type="url" id="fUrl" placeholder="https://" autocomplete="off">
    <div class="hint">アプリを入れてあれば、公式サイトのURLを開いたときにアプリが起動する場合があります。起動しない店は、アプリ用のリンクに差し替えて調整してください。</div>
    <label for="fColor">ボタンの色</label>
    <input type="color" id="fColor" value="#e8590c">
    <label for="fNote">メモ（ログイン方法、クーポンの場所など）</label>
    <textarea id="fNote"></textarea>
    <div class="btn-row">
      <button id="cancelBtn">やめる</button>
      <button class="primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<script>
/* ========== 保存データ ========== */
const KEY = 'shopLauncher.v1';

const DEFAULT_SHOPS = [
  { name: 'ブックオフ', url: 'https://www.bookoff.co.jp/', color: '#1c7ed6', note: '' },
  { name: 'nanaco',     url: 'https://www.nanaco-net.jp/', color: '#2f9e44', note: '' },
  { name: 'セブン-イレブン', url: 'https://www.sej.co.jp/', color: '#e8590c', note: 'プリンターで印刷するときに使う' },
  { name: '無印良品',   url: 'https://www.muji.com/jp/',   color: '#8a6d4b', note: '' },
  { name: 'ニトリ',     url: 'https://www.nitori-net.jp/', color: '#1971c2', note: '高額な買い物のときはポイントを忘れずに' },
  { name: 'サーティワン', url: 'https://www.31ice.co.jp/', color: '#e64980', note: '' },
  { name: 'マクドナルド', url: 'https://www.mcdonalds.co.jp/', color: '#f08c00', note: '' },
  { name: 'ピザ屋',     url: '', color: '#c92a2a', note: 'URLを設定してください' }
];

let shops = load();
let editingIndex = -1; // -1: 新規追加

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return DEFAULT_SHOPS.map(s => ({ ...s, lastOpened: null }));
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(shops)); } catch (e) {}
}

/* ========== 表示 ========== */
const listEl = document.getElementById('list');
const searchEl = document.getElementById('search');

function fmtDate(ts) {
  if (!ts) return '未起動';
  const d = new Date(ts);
  return '最終起動：' + d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ===== 表示切り替え（一覧 / 場所別） ===== */
let viewMode = 'list';
try { viewMode = localStorage.getItem(KEY + '.view') || 'list'; } catch (e) {}

function splitPlaces(str) {
  return String(str || '').split(/[,、，]/).map(t => t.trim()).filter(Boolean);
}

function itemHtml(s, i) {
  const initial = esc((s.name || '?').charAt(0));
  const hasUrl = !!s.url;
  return `
      <div class="item">
        <a class="launch" ${hasUrl ? `href="${esc(s.url)}"` : ''} data-i="${i}">
          <div class="badge" style="background:${esc(s.color || '#e8590c')}">${initial}</div>
          <div class="info">
            <div class="name">${esc(s.name)}</div>
            <div class="last">${fmtDate(s.lastOpened)}</div>
            ${hasUrl ? '' : '<div class="nourl">URL未設定（編集から入力）</div>'}
            ${s.note ? `<div class="note">${esc(s.note)}</div>` : ''}
          </div>
        </a>
        <div class="tools">
          <button class="mv" data-act="up" data-i="${i}">▲</button>
          <button data-act="edit" data-i="${i}">✎</button>
          <button class="mv" data-act="down" data-i="${i}">▼</button>
        </div>
      </div>`;
}

function render() {
  const q = searchEl.value.trim().toLowerCase();
  document.body.classList.toggle('grouped', viewMode === 'place');
  document.getElementById('tabList').classList.toggle('on', viewMode === 'list');
  document.getElementById('tabPlace').classList.toggle('on', viewMode === 'place');

  const hits = [];
  shops.forEach((s, i) => {
    const hit = !q || (s.name + ' ' + (s.note || '') + ' ' + (s.place || '')).toLowerCase().includes(q);
    if (hit) hits.push([s, i]);
  });
  if (!hits.length) { listEl.innerHTML = '<div class="empty">該当するお店がありません</div>'; return; }

  if (viewMode === 'list') {
    listEl.innerHTML = hits.map(([s, i]) => itemHtml(s, i)).join('');
    return;
  }

  // 場所別：1つの店が複数の場所に出る
  const groups = new Map();
  hits.forEach(([s, i]) => {
    const places = splitPlaces(s.place);
    (places.length ? places : ['場所未設定']).forEach(p => {
      if (!groups.has(p)) groups.set(p, []);
      groups.get(p).push([s, i]);
    });
  });
  // 「場所未設定」は最後に
  const names = [...groups.keys()].sort((a, b) => (a === '場所未設定') - (b === '場所未設定'));
  listEl.innerHTML = names.map(p => `
    <details class="group" open>
      <summary>${esc(p)} <span class="cnt">${groups.get(p).length}</span></summary>
      <div class="group-body">${groups.get(p).map(([s, i]) => itemHtml(s, i)).join('')}</div>
    </details>`).join('');
}

document.getElementById('tabList').addEventListener('click', () => setView('list'));
document.getElementById('tabPlace').addEventListener('click', () => setView('place'));
function setView(v) {
  viewMode = v;
  try { localStorage.setItem(KEY + '.view', v); } catch (e) {}
  render();
}

/* ========== 起動 ========== */
listEl.addEventListener('click', e => {
  const launch = e.target.closest('.launch');
  if (launch) {
    if (document.body.classList.contains('editing')) { e.preventDefault(); return; }
    const i = Number(launch.dataset.i);
    if (!shops[i].url) { e.preventDefault(); openSheet(i); return; }
    shops[i].lastOpened = Date.now();
    save();
    return; // そのままリンク遷移
  }
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const i = Number(btn.dataset.i);
  const act = btn.dataset.act;
  if (act === 'edit') openSheet(i);
  if (act === 'up' && i > 0) { [shops[i - 1], shops[i]] = [shops[i], shops[i - 1]]; save(); render(); }
  if (act === 'down' && i < shops.length - 1) { [shops[i + 1], shops[i]] = [shops[i], shops[i + 1]]; save(); render(); }
});

searchEl.addEventListener('input', render);

/* ========== 編集モード ========== */
const editToggle = document.getElementById('editToggle');
editToggle.addEventListener('click', () => {
  const on = document.body.classList.toggle('editing');
  editToggle.classList.toggle('on', on);
  editToggle.textContent = on ? '完了' : '編集';
});

/* ========== 追加・編集シート ========== */
const backdrop = document.getElementById('backdrop');
const fName = document.getElementById('fName');
const fUrl = document.getElementById('fUrl');
const fColor = document.getElementById('fColor');
const fNote = document.getElementById('fNote');
const fPlace = document.getElementById('fPlace');

function openSheet(i) {
  editingIndex = i;
  const s = i >= 0 ? shops[i] : { name: '', url: '', color: '#e8590c', note: '', place: '' };
  document.getElementById('sheetTitle').textContent = i >= 0 ? 'お店を編集' : 'お店を追加';
  fName.value = s.name; fUrl.value = s.url || ''; fColor.value = s.color || '#e8590c'; fNote.value = s.note || '';
  fPlace.value = s.place || '';
  // 既存の場所名を入力候補に
  const all = new Set();
  shops.forEach(x => splitPlaces(x.place).forEach(p => all.add(p)));
  document.getElementById('placeList').innerHTML = [...all].map(p => `<option value="${esc(p)}">`).join('');
  // 編集時のみ削除ボタンを出す
  let del = document.getElementById('delBtn');
  if (del) del.remove();
  if (i >= 0) {
    del = document.createElement('button');
    del.id = 'delBtn';
    del.textContent = 'このお店を削除';
    del.style.cssText = 'width:100%;margin-top:12px;padding:12px;border-radius:12px;border:1px solid #f1b0b0;background:#fff5f5;color:#c92a2a;font-size:14px;';
    del.addEventListener('click', () => {
      if (confirm('「' + shops[editingIndex].name + '」を削除しますか？')) {
        shops.splice(editingIndex, 1); save(); closeSheet(); render();
      }
    });
    document.querySelector('.sheet').appendChild(del);
  }
  backdrop.classList.add('show');
}
function closeSheet() { backdrop.classList.remove('show'); }

document.getElementById('addBtn').addEventListener('click', () => openSheet(-1));
document.getElementById('cancelBtn').addEventListener('click', closeSheet);
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeSheet(); });

document.getElementById('saveBtn').addEventListener('click', () => {
  const name = fName.value.trim();
  if (!name) { alert('店名を入力してください'); return; }
  const data = { name, url: fUrl.value.trim(), color: fColor.value, note: fNote.value.trim(), place: fPlace.value.trim() };
  if (editingIndex >= 0) {
    shops[editingIndex] = { ...shops[editingIndex], ...data };
  } else {
    shops.push({ ...data, lastOpened: null });
  }
  save(); closeSheet(); render();
});

render();

/* ========== PWA（Service Worker登録） ========== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
